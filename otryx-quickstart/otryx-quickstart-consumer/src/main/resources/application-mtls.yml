otryx:
  rpc:
    security-profile: NETWORK_MTLS
    codec:
      fory:
        mode: STRICT_ALLOWLIST
        allowed-class-patterns:
          - com.peachsoft.otryx.quickstart.api.*
    transport:
      security:
        mode: MTLS
        certificate-path: ${OTRYX_RPC_TLS_CERT}
        private-key-path: ${OTRYX_RPC_TLS_KEY}
        trust-certificate-path: ${OTRYX_RPC_TLS_CA}
        hostname-verification: true
        reload-interval: 30s
        expiry-warning-threshold: 7d
