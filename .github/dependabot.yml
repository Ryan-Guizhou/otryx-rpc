# Snapshot freeze: no routine version bump PRs before 1.0.0 GA.
# Security updates remain eligible, and must pass the PR vulnerability gate.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
