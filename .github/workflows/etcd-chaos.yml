name: Etcd Chaos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'otryx-core/src/main/java/com/peachsoft/otryx/registry/**'
      - 'otryx-registry/otryx-registry-etcd/**'
      - '.github/workflows/etcd-chaos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  leader-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Etcd leader-transfer chaos
        run: >
          mvn -B -ntp
          -pl otryx-registry/otryx-registry-etcd
          -am
          test
          -Petcd-chaos

      - name: Upload original Etcd chaos test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etcd-chaos-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            otryx-core/target/surefire-reports/**
            otryx-registry/otryx-registry-etcd/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 30
