name: Dependency Vulnerability Review

on:
  pull_request:
    paths:
      - '**/pom.xml'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/first-release-dry-run.yml'

permissions:
  contents: read

jobs:
  osv-diff:
    permissions:
      contents: read
      actions: read
    # Compare a complete scan of the base with the proposed pull request.
    # This does not depend on repository Dependency Graph being enabled.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
    with:
      scan-args: |
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: false
