name: Safe merged branch cleanup

# Prune only main ancestors or exact GitHub-confirmed squash-merged PR heads.
# Open PR heads and stable/release/support/maintenance/archive branches remain protected.
# Updating this file intentionally triggers one safe post-merge cleanup pass.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-merged-branches.yml
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply merged-branch cleanup (default dry-run)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: otryx-prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Snapshot open PRs, verified merged heads and clean safely
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_MODE: ${{ github.event_name == 'push' && 'apply' || (inputs.apply && 'apply' || 'dry-run') }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].head.ref' > "${RUNNER_TEMP}/otryx-open-pr-heads.txt"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main" and .head.repo.full_name == .base.repo.full_name and .merge_commit_sha != null) | [.head.ref, .head.sha, .merge_commit_sha] | @tsv' \
            > "${RUNNER_TEMP}/otryx-merged-pr-heads.tsv"
          OPEN_PR_HEAD_FILE="${RUNNER_TEMP}/otryx-open-pr-heads.txt" \
          MERGED_PR_HEAD_FILE="${RUNNER_TEMP}/otryx-merged-pr-heads.tsv" \
            bash scripts/cleanup_merged_branches.sh
