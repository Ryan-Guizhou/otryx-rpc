name: Fory Allocation Comparison

on:
  pull_request:
    paths:
      - "otryx-serialization/otryx-serialization-fory/src/main/java/com/peachsoft/otryx/codec/fory/ForyRpcCodec.java"
      - "otryx-benchmarks/src/main/java/com/peachsoft/otryx/benchmarks/ForyArgumentEncodingBenchmark.java"
      - "scripts/compare_fory_allocation.py"
      - "scripts/test_compare_fory_allocation.py"
      - "scripts/run_fory_allocation_comparison.sh"
      - ".github/workflows/fory-allocation-comparison.yml"
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: "Exact comparison baseline SHA (40 chars)"
        required: true
        type: string
      candidate_sha:
        description: "Exact candidate SHA (40 chars)"
        required: true
        type: string

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate and full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test evidence validator with negative cases
        run: python3 scripts/test_compare_fory_allocation.py

      - name: Identify breaking API-generation migration
        id: api_generation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:peach-rpc-core/pom.xml" 2>/dev/null; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Paired Fory JMH allocation smoke
        if: steps.api_generation.outputs.breaking != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          OTRYX_RPC_FORY_COMPARE_RUNS: "1"
          OTRYX_RPC_FORY_EVIDENCE_CLASS: shared-ci-smoke
          OTRYX_RPC_FORY_JMH_WARMUP: "1"
          OTRYX_RPC_FORY_JMH_MEASUREMENT: "1"
          OTRYX_RPC_FORY_JMH_TIME: "500ms"
          OTRYX_RPC_ALLOCATION_JVM_FLAGS: "-Xms256m -Xmx256m"
        run: bash scripts/run_fory_allocation_comparison.sh "$BASE_SHA" "$HEAD_SHA"

      - name: OTRYX migration benchmark smoke (not a cross-generation performance comparison)
        if: steps.api_generation.outputs.breaking == 'true'
        run: |
          python3 scripts/check_migration_readiness.py
          mvn -B -ntp -pl otryx-codegen -am -DskipTests install
          mvn -B -ntp -pl otryx-benchmarks -am -DskipTests package
          mkdir -p target/fory-migration-smoke
          java -jar otryx-benchmarks/target/benchmarks.jar 'ForyArgumentEncodingBenchmark' -wi 1 -i 1 -w 200ms -r 200ms -f 1 -rf json -rff target/fory-migration-smoke/candidate.json
          {
            echo "## Major API rebrand: historical allocation pair not comparable"
            echo "Only the OTRYX candidate JMH smoke was executed."
            echo "The old Java API/class paths differ from the new generation."
            echo "No allocation or p99 improvement claim can be derived from this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JMH evidence and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fory-allocation-smoke-${{ github.run_id }}
          path: |
            target/fory-allocation-comparison/baseline/run-*/*.json
            target/fory-allocation-comparison/candidate/run-*/*.json
            target/fory-allocation-comparison/environment.json
            target/fory-allocation-comparison/comparison.json
            target/fory-allocation-comparison/comparison.md
          if-no-files-found: warn
          retention-days: 30
