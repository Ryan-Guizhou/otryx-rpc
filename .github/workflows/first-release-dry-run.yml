name: OTRYX First Release Dry Run

on:
  pull_request:
    paths:
      - '.github/workflows/first-release-dry-run.yml'
      - 'scripts/first_release_dry_run.py'
      - 'scripts/test_first_release_dry_run.py'
      - 'scripts/check_central_publication.py'
      - 'docs/reference/first-release-acceptance.md'
      - 'docs/reference/v2-20-final-gates.md'
      - 'pom.xml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/first-release-dry-run.yml'
      - 'scripts/first_release_dry_run.py'
      - 'scripts/test_first_release_dry_run.py'
      - 'scripts/check_central_publication.py'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      stage:
        description: Build unsigned RC1 or GA candidate evidence without publishing
        required: true
        type: choice
        options:
          - rc1
          - ga

permissions:
  contents: read

concurrency:
  group: otryx-first-release-dry-run-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.stage || 'both' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Unsigned ${{ matrix.stage }} candidate
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.stage) || '["rc1","ga"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      nacos:
        image: nacos/nacos-server:v3.2.4
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          NACOS_AUTH_TOKEN: "UGVhY2hScGNDb250cm9sUGxhbmVTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA=="
          NACOS_AUTH_IDENTITY_KEY: otryx-ci
          NACOS_AUTH_IDENTITY_VALUE: otryx-ci-secret
        ports:
          - 8848:8848
          - 9848:9848
    env:
      NACOS_TEST_ENDPOINT: 127.0.0.1:8848
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve fixed first-release version
        id: release
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          case "$STAGE" in
            rc1) VERSION="1.0.0-RC1" ;;
            ga) VERSION="1.0.0" ;;
            *) echo "Unexpected dry-run stage" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify repository, packaging configuration and negative fixtures
        run: |
          python3 scripts/check_project.py
          python3 scripts/check_central_publication.py
          python3 scripts/test_first_release_dry_run.py
          python3 scripts/first_release_dry_run.py \
            --stage "${{ matrix.stage }}" \
            --version "${{ steps.release.outputs.version }}" \
            --preflight-only

      - name: Wait for Nacos
        shell: bash
        run: |
          for attempt in {1..60}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8848' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Nacos did not start for the dry-run" >&2
          exit 1

      - name: Build real RC or GA classfiles and signed-profile-ready artifact shape
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./mvnw -B -ntp "-Drevision=$VERSION" \
            clean verify -Pquality,release
          python3 scripts/check_central_publication.py \
            --version "$VERSION" --require-artifacts

      - name: Generate CycloneDX aggregate software bill of materials
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./mvnw -B -ntp "-Drevision=$VERSION" \
            -DoutputFormat=json \
            -DoutputName=bom \
            -DoutputReactorProjects=false \
            -Dcyclonedx.skipAttach=true \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          test -s target/bom.json

      - name: Verify and record unsigned evidence tied to checkout SHA
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STAGE: ${{ matrix.stage }}
        run: |
          python3 scripts/first_release_dry_run.py \
            --stage "$STAGE" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --sbom target/bom.json \
            --output-dir target/first-release-evidence

      - name: Upload unsigned dry-run artifacts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: otryx-${{ steps.release.outputs.version }}-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/bom.json
            target/first-release-evidence/manifest.json
            target/first-release-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 60

# Intentionally no signing, tags, GitHub Release, deployment or Central upload.
