name: Consul V2 Integration and Chaos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'otryx-registry/otryx-registry-consul/**'
      - '.github/workflows/consul-v2.yml'
      - 'docs/reference/registry-consul-v2.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consul-real:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CONSUL_TEST_ENDPOINT: http://127.0.0.1:8500
      CONSUL_CHAOS_CONTAINER: otryx-consul-v2-ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start real Consul 1.22.7
        run: |
          docker run -d --name "$CONSUL_CHAOS_CONTAINER" \
            -p 8500:8500 \
            hashicorp/consul:1.22.7 \
            agent -dev -client=0.0.0.0

      - name: Wait for Consul leader
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8500/v1/status/leader \
              | grep -q ':'; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$CONSUL_CHAOS_CONTAINER"
          exit 1

      - name: Verify real Consul provider consumer KV CAS and lifecycle
        run: >
          mvn -B -ntp
          -pl otryx-registry/otryx-registry-consul
          -am test

      - name: Verify Consul Session expiration TTL and pause recovery
        run: >
          mvn -B -ntp
          -pl otryx-registry/otryx-registry-consul
          -am test -Pconsul-chaos

      - name: Consul failure logs
        if: failure()
        run: docker logs "$CONSUL_CHAOS_CONTAINER" || true

      - name: Cleanup
        if: always()
        run: docker rm -f "$CONSUL_CHAOS_CONTAINER" || true
