name: Java Style Audit

on:
  pull_request:
    paths:
      - "**/*.java"
      - "pom.xml"
      - ".github/checkstyle/otryx-checkstyle.xml"
      - "scripts/summarize_checkstyle_audit.py"
      - "scripts/test_checkstyle_audit.py"
      - ".github/workflows/java-style-audit.yml"
      - "docs/engineering/**"
jobs:
  style-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Java 21 and Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Checkstyle audit aggregation tests
        run: python3 scripts/test_checkstyle_audit.py

      - name: Run complete reactor Checkstyle audit under Java 21
        run: mvn -B -ntp -Pstyle-audit -DskipTests install

      - name: Require every Maven module report and zero Checkstyle violations
        run: |
          python3 scripts/summarize_checkstyle_audit.py \
            --json target/checkstyle-audit.json \
            --markdown target/checkstyle-audit.md \
            --enforce-zero
          cat target/checkstyle-audit.md

      - name: Upload original XML and strict gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-style-gate-${{ github.run_id }}
          path: |
            **/target/checkstyle-result.xml
            target/checkstyle-audit.json
            target/checkstyle-audit.md
          if-no-files-found: warn
          retention-days: 30
