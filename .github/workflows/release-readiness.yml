name: Release Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'otryx-*/**'
      - 'README.md'
      - 'README.en-US.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'ROADMAP.md'
      - 'LICENSE'
      - 'docs/**'
      - 'deploy/observability/**'
      - 'scripts/check_project.py'
      - 'scripts/check_java_magic_literals.py'
      - 'scripts/test_java_magic_literals.py'
      - 'scripts/check_repository_identity.py'
      - 'scripts/test_repository_identity.py'
      - 'scripts/check_central_publication.py'
      - 'scripts/check_release_version.py'
      - 'scripts/check_release_readiness.py'
      - 'scripts/first_release_dry_run.py'
      - 'scripts/test_first_release_dry_run.py'
      - '.github/workflows/first-release-dry-run.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/dependabot.yml'
      - '.github/workflows/release-readiness.yml'
      - '.github/workflows/release.yml'
      - 'pom.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve current patch version
        id: release
        shell: bash
        run: |
          VERSION="$(awk -F= '$1 == "version" {print $2}' docs/release-status.properties)"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve release version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Repository checks
        run: python3 scripts/check_project.py

      - name: Verify OTRYX migration readiness
        if: ${{ endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: python3 scripts/check_migration_readiness.py

      - name: Verify unsigned RC/GA dry-run contract and negative fixtures
        if: ${{ endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: |
          python3 scripts/test_first_release_dry_run.py
          python3 scripts/first_release_dry_run.py \
            --stage rc1 --version 1.0.0-RC1 --preflight-only
          python3 scripts/first_release_dry_run.py \
            --stage ga --version 1.0.0 --preflight-only

      - name: Verify migration Maven reactor
        if: ${{ endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: mvn -B -ntp clean verify -Pquality

      - name: Verify Maven Central publication configuration
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: python3 scripts/check_central_publication.py

      - name: Verify current patch release contract
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: >
          python3 scripts/check_release_version.py
          --stage patch
          --version ${{ steps.release.outputs.version }}

      - name: Verify current patch release readiness
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: >
          python3 scripts/check_release_readiness.py
          --stage patch
          --version ${{ steps.release.outputs.version }}

      - name: Verify current patch Maven reactor
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: mvn -B -ntp clean verify -Pquality,release

      - name: Verify Maven Central artifact shape
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        run: >
          python3 scripts/check_central_publication.py
          --version ${{ steps.release.outputs.version }}
          --require-artifacts

      - name: Build release artifact inventory
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        shell: bash
        run: |
          mkdir -p target
          find . -path '*/target/*.jar' -type f -print \
            | sort > target/release-artifacts.txt
          test -s target/release-artifacts.txt
          cat target/release-artifacts.txt

      - name: Upload release artifact inventory
        if: ${{ !endsWith(steps.release.outputs.version, '-SNAPSHOT') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otryx-release-readiness-${{ steps.release.outputs.version }}-${{ github.run_id }}
          path: target/release-artifacts.txt
          if-no-files-found: error
          retention-days: 30
