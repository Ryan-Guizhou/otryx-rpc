name: Nacos Chaos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'otryx-core/**'
      - 'otryx-spring-boot/**'
      - 'pom.xml'
      - 'otryx-registry/otryx-registry-nacos/**'
      - '.github/workflows/nacos-chaos.yml'
  push:
    branches: [main]
    paths:
      - 'otryx-core/**'
      - 'otryx-spring-boot/**'
      - 'pom.xml'
      - 'otryx-registry/otryx-registry-nacos/**'
      - '.github/workflows/nacos-chaos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pause-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NACOS_TEST_ENDPOINT: 127.0.0.1:8848
      NACOS_CHAOS_CONTAINER: otryx-nacos-chaos
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start Nacos
        run: |
          docker run -d \
            --name "$NACOS_CHAOS_CONTAINER" \
            -p 8848:8848 \
            -p 9848:9848 \
            -e MODE=standalone \
            -e NACOS_AUTH_ENABLE=false \
            -e NACOS_AUTH_TOKEN=UGVhY2hScGNDb250cm9sUGxhbmVTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA== \
            -e NACOS_AUTH_IDENTITY_KEY=otryx-ci \
            -e NACOS_AUTH_IDENTITY_VALUE=otryx-ci-secret \
            nacos/nacos-server:v3.2.4

      - name: Wait for Nacos
        shell: bash
        run: |
          for attempt in {1..90}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8848' 2>/dev/null; then
              sleep 25
              exit 0
            fi
            sleep 2
          done
          docker logs "$NACOS_CHAOS_CONTAINER"
          exit 1

      - name: Verify Nacos pause recovery chaos
        run: >
          mvn -B -ntp
          -pl otryx-registry/otryx-registry-nacos
          -am
          test
          -Pnacos-chaos

      - name: Capture Nacos server diagnostics
        if: always()
        run: |
          mkdir -p target/registry-ci/nacos
          docker logs "$NACOS_CHAOS_CONTAINER" > target/registry-ci/nacos/server.log 2>&1 || true

      - name: Upload original Nacos chaos test reports and server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nacos-chaos-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            otryx-core/target/surefire-reports/**
            otryx-registry/otryx-registry-nacos/target/surefire-reports/**
            target/registry-ci/nacos/server.log
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker rm -f "$NACOS_CHAOS_CONTAINER" || true
