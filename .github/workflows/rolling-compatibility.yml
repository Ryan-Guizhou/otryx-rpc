name: Rolling Compatibility

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline Git ref used as version N
        required: true
        default: main
        type: string
  pull_request:
    paths:
      - 'otryx-core/**'
      - 'otryx-codegen/**'
      - 'otryx-serialization/otryx-serialization-fory/**'
      - 'otryx-transport/otryx-transport-vertx/**'
      - 'otryx-registry/**'
      - 'otryx-spring-boot/**'
      - 'otryx-quickstart/**'
      - 'pom.xml'
      - 'docs/release-status.properties'
      - 'scripts/run_rolling_compatibility_e2e.sh'
      - 'scripts/bootstrap_quickstart_nacos.sh'
      - 'scripts/check_registry_generation_boundary.py'
      - 'scripts/test_registry_generation_boundary.py'
      - '.github/workflows/rolling-compatibility.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      nacos:
        image: nacos/nacos-server:v3.2.4
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          NACOS_AUTH_TOKEN: "UGVhY2hScGNDb250cm9sUGxhbmVTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA=="
          NACOS_AUTH_IDENTITY_KEY: otryx-ci
          NACOS_AUTH_IDENTITY_VALUE: otryx-ci-secret
        ports:
          - 8848:8848
          - 9848:9848
    env:
      NACOS_TEST_ENDPOINT: 127.0.0.1:8848
      BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.baseline_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify registry generation and required JVM matrix fixtures
        run: python3 scripts/test_registry_generation_boundary.py

      - name: Wait for Nacos
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness >/dev/null \
                && timeout 1 bash -c '</dev/tcp/127.0.0.1/9848' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Nacos did not become ready in time"
          exit 1

      - name: Prepare version N worktree
        shell: bash
        run: |
          git fetch origin "$BASELINE_REF" --depth=1 || true
          git worktree add target/compat-n "$BASELINE_REF"

      - name: Record actual baseline and candidate commits
        shell: bash
        run: |
          mkdir -p target/rolling-compatibility
          baseline_sha="$(git -C target/compat-n rev-parse HEAD)"
          candidate_sha="$(git rev-parse HEAD)"
          printf 'baseline=%s\ncandidate=%s\n' "$baseline_sha" "$candidate_sha" \
            > target/rolling-compatibility/commits.properties

      - name: Reject unsupported baseline before building or running processes
        run: python3 scripts/check_registry_generation_boundary.py target/compat-n .

      - name: Build application-level Quickstart baseline
        working-directory: target/compat-n
        run: |
          mvn -B -ntp -pl otryx-codegen -am install -DskipTests
          mvn -B -ntp -pl otryx-quickstart/otryx-quickstart-provider,otryx-quickstart/otryx-quickstart-consumer -am package -DskipTests

      - name: Install version N+1 annotation processor
        run: >
          mvn -B -ntp
          -pl otryx-codegen
          -am
          install
          -DskipTests

      - name: Build version N+1 Quickstart
        run: >
          mvn -B -ntp
          -pl otryx-quickstart/otryx-quickstart-provider,otryx-quickstart/otryx-quickstart-consumer
          -am
          package
          -DskipTests

      - name: Verify all five application-level rolling and rollback pairs
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run_rolling_compatibility_e2e.sh \
            "$PWD/target/compat-n" "$PWD" 2>&1 \
            | tee target/rolling-compatibility/matrix.log

      - name: Upload actual rolling commits and five-pair process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/rolling-compatibility
          if-no-files-found: warn
          retention-days: 30
