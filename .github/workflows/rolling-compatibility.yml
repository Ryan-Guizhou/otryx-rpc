name: Rolling Compatibility

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline Git ref used as version N
        required: true
        default: main
        type: string
  pull_request:
    paths:
      - 'otryx-core/**'
      - 'otryx-serialization/otryx-serialization-fory/**'
      - 'otryx-transport/otryx-transport-vertx/**'
      - 'otryx-registry/**'
      - 'otryx-spring-boot/**'
      - 'otryx-quickstart/**'
      - 'otryx-examples/**'
      - 'pom.xml'
      - 'docs/release-status.properties'
      - 'scripts/run_rolling_compatibility_e2e.sh'
      - 'scripts/bootstrap_quickstart_nacos.sh'
      - 'scripts/check_registry_generation_boundary.py'
      - 'scripts/test_registry_generation_boundary.py'
      - '.github/workflows/rolling-compatibility.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      nacos:
        image: nacos/nacos-server:v3.2.4
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: "false"
          NACOS_AUTH_TOKEN: "UGVhY2hScGNDb250cm9sUGxhbmVTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA=="
          NACOS_AUTH_IDENTITY_KEY: otryx-ci
          NACOS_AUTH_IDENTITY_VALUE: otryx-ci-secret
        ports:
          - 8848:8848
          - 9848:9848
    env:
      NACOS_TEST_ENDPOINT: 127.0.0.1:8848
      BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify registry generation and required JVM matrix fixtures
        run: python3 scripts/test_registry_generation_boundary.py

      - name: Wait for Nacos
        shell: bash
        run: |
          for attempt in {1..90}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8848' 2>/dev/null               && timeout 1 bash -c '</dev/tcp/127.0.0.1/9848' 2>/dev/null; then
              sleep 25
              exit 0
            fi
            sleep 2
          done
          echo "Nacos did not become ready in time"
          exit 1

      - name: Prepare version N worktree
        shell: bash
        run: |
          git fetch origin "$BASELINE_REF" --depth=1 || true
          git worktree add target/compat-n "$BASELINE_REF"

      - name: Detect API generation boundary
        id: baseline
        run: |
          if test -d target/compat-n/peach-rpc-core; then
            echo "family=peach" >> "$GITHUB_OUTPUT"
          elif test -d target/compat-n/otryx-quickstart; then
            echo "family=otryx-quickstart" >> "$GITHUB_OUTPUT"
          elif test -d target/compat-n/otryx-examples; then
            echo "family=otryx-legacy" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown baseline layout"
            exit 1
          fi

      - name: Build historical Peach RPC baseline
        if: steps.baseline.outputs.family == 'peach'
        working-directory: target/compat-n
        run: |
          mvn -B -ntp -pl peach-rpc-codegen -am install -DskipTests
          mvn -B -ntp -pl peach-rpc-examples/peach-rpc-example-provider,peach-rpc-examples/peach-rpc-example-consumer -am package -DskipTests

      - name: Build same-generation OTRYX baseline
        if: steps.baseline.outputs.family == 'otryx-legacy'
        working-directory: target/compat-n
        run: |
          mvn -B -ntp -pl otryx-codegen -am install -DskipTests
          mvn -B -ntp -pl otryx-examples/otryx-example-provider,otryx-examples/otryx-example-consumer -am package -DskipTests

      - name: Build current Quickstart baseline
        if: steps.baseline.outputs.family == 'otryx-quickstart'
        working-directory: target/compat-n
        run: |
          mvn -B -ntp -pl otryx-codegen -am install -DskipTests
          mvn -B -ntp -pl otryx-quickstart/otryx-quickstart-provider,otryx-quickstart/otryx-quickstart-consumer -am package -DskipTests

      - name: Install version N+1 annotation processor
        run: >
          mvn -B -ntp
          -pl otryx-codegen
          -am
          install
          -DskipTests

      - name: Build version N+1 Quickstart
        run: >
          mvn -B -ntp
          -pl otryx-quickstart/otryx-quickstart-provider,otryx-quickstart/otryx-quickstart-consumer
          -am
          package
          -DskipTests

      - name: Verify both Quickstart generations and supported rolling pairs
        if: steps.baseline.outputs.family == 'otryx-quickstart'
        run: >
          bash scripts/run_rolling_compatibility_e2e.sh
          "$PWD/target/compat-n"
          "$PWD"

      - name: Verify breaking Peach-to-OTRYX migration boundary
        if: steps.baseline.outputs.family != 'otryx-quickstart'
        run: |
          python3 scripts/check_migration_readiness.py
          bash scripts/run_quickstart_process_e2e.sh
          {
            echo "## Explicit unpublished API namespace migration"
            echo "The historical baseline was independently built."
            echo "The current OTRYX Quickstart was independently tested."
            echo "Cross-generation rolling compatibility has **not** been established."
            echo "Use service/registry isolation and the documented blue-green migration."
          } >> "$GITHUB_STEP_SUMMARY"
